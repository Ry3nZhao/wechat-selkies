[project]
name = "wechat-api"
version = "0.1.0"
description = "OneBot v11 gateway for the WeChat Linux client running in wechat-selkies"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "aiohttp==3.12.15",
    "pillow==11.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-aiohttp==1.1.0",
]

[project.scripts]
wechat-api = "wechat_api.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
